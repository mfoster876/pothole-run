<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pothole Run — sprite gallery (dev tool)</title>
<style>
  body { background: #0e1a12; color: #cbe7cf; font: 14px "Courier New", monospace; }
  .cell { display: inline-block; margin: 8px; text-align: center; }
  canvas { background: #3a3a40; display: block; margin-bottom: 4px; border: 1px solid #2a4830; }
</style>
</head>
<body>
<h3>Sprite gallery — dev eyeball tool (not shipped in the game UI)</h3>
<div id="grid"></div>
<script type="module">
  import { drawEntity, drawRoadkill } from '../src/sprites.js';
  import { renderPortrait } from '../src/portrait.js';

  const grid = document.getElementById('grid');
  function cell(label, w, h, draw) {
    const div = document.createElement('div'); div.className = 'cell';
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'));
    div.appendChild(c);
    div.appendChild(document.createTextNode(label));
    grid.appendChild(div);
  }

  // entities at a generous size (as if close to the cart) — comprehensive pickup/hazard pass
  const ALL = [
    // road hazards
    'pothole','manhole','slick','flood','bump','stall',
    // pickups — utility + foods
    'coin','water','tools','coffee','fruit',
    'ackee','unripeackee','plantain','breadfruit','patty','veggiepatty',
    // drinks
    'ting','boom','redstripe','whiterum','spirulina','rootstonic','henny','rose','whitewine','champagne',
    // character items
    'books','stationery','bagjuice','lasco','privatebribe','ladynight','schoolbell','extralessons',
    // negatives
    'bleaching','tightpants','weed','molly','teensex','obeah','pork','jw',
    'cakesoap','blchmix','blchtub','sunlight',
    'roadfix','constituent','lightpole','hustlerlunch','voter','contractor','placementbribe','ptameeting',
    // river mode
    'floatbottle','plasticbag','croc','burntcar','floatcar','limerock','rivermumma',
    'swimmer','tyreswing','rockfall',
    // animals / people / traffic
    'goat','dog','cat','cattle','coconutcart','hustler','jaywalker','beggar','vendor','peanutcart','broomman',
    'taxi','bus','coaster','police','wiper',
  ];
  for (const t of ALL) {
    cell(t, 150, 150, (ctx) => drawEntity(ctx, t, 75, 120, 52, 0.4));
  }
  // coin denominations (value drives the metal colour)
  for (const v of [1, 5, 10, 20]) {
    cell('coin $' + v, 150, 150, (ctx) => drawEntity(ctx, 'coin', 75, 110, 60, 0.4, v));
  }
  // roadkill per victim type — the corpse must match who was hit
  for (const [type, cat] of [['broomman', 'pedestrian'], ['vendor', 'pedestrian'], ['beggar', 'pedestrian'], ['hustler', 'pedestrian'], ['goat', 'animal'], ['dog', 'animal'], ['cattle', 'animal']]) {
    cell('hit: ' + type, 180, 180, (ctx) => drawRoadkill(ctx, 90, 110, 60, 1, cat, 0.35, type));
  }
  // portraits — clip fix + the new Principal
  for (const id of ['yute', 'student', 'principal', 'higgler']) {
    cell(id, 180, 180, (ctx) => renderPortrait(ctx, id, 90, 90, 160));
  }
</script>
</body>
</html>
